<div class="container my-4">

    <form class="search-bar mx-auto">

        <div class="search-item">

            <label for="destino">
                Dónde
            </label>

            <input
                    type="text"
                    id="destino"
                    name="destino"
                    placeholder="Buscar destinos"
                    [(ngModel)]="destino">

        </div>


        <div class="search-item">

            <label for="llegada">
                Llegada
            </label>

            <input
                    type="date"
                    id="llegada"
                    name="llegada"
                    [(ngModel)]="llegada">

        </div>


        <div class="search-item">

            <label for="salida">
                Salida
            </label>

            <input
                    type="date"
                    id="salida"
                    name="salida"
                    [(ngModel)]="salida">

        </div>


        <div class="search-item">

            <label for="huespedes">
                Quién
            </label>

            <input
                    type="number"
                    id="huespedes"
                    name="huespedes"
                    min="1"
                    placeholder="¿Cuántos huéspedes?"
                    [(ngModel)]="huespedes">

        </div>


        <button
                type="button"
                class="search-btn"
                aria-label="Buscar"
                [routerLink]="['/alojamientos']"
                [state]="{
                filtros: {
                    destino: destino,
                    llegada: llegada,
                    salida: salida,
                    huespedes: huespedes
                }
            }">

            <i class="bi bi-search"></i>

        </button>

    </form>

</div>
