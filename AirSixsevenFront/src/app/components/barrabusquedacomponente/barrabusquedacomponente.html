<div class="container my-4">
  <form class="search-bar mx-auto">

    <div class="search-item">
      <label for="destino">Dónde</label>
      <input type="text" id="destino" placeholder="Buscar destinos">
    </div>

    <div class="search-item">
      <label for="llegada">Llegada</label>
      <input type="date" id="llegada">
    </div>

    <div class="search-item">
      <label for="salida">Salida</label>
      <input type="date" id="salida">
    </div>

    <div class="search-item">
      <label for="huespedes">Quién</label>
      <input type="number" id="huespedes" min="1" placeholder="¿Cuántos huéspedes?">
    </div>

    <button type="submit" class="search-btn" aria-label="Buscar">
      <i class="bi bi-search"></i>
    </button>

  </form>
</div>
