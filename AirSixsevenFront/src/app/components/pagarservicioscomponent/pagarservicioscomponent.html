

<section class="pagar" *ngIf="servicio">

    <h2>Confirma tu servicio</h2>

    <div class="contenido">

        <!-- Columna izquierda: servicio, fecha y hora -->
        <div class="columna-izq">

            <div class="resumen">
                <img [src]="servicio.imagen" [alt]="servicio.titulo">

                <div class="datos">
                    <h3>{{ servicio.titulo }}</h3>
                    <p class="gris">{{ servicio.ciudad }}</p>
                    <p class="gris">{{ servicio.unidad }}</p>
                    <p class="gris">★ {{ servicio.rating }}</p>
                </div>
            </div>

            <label for="fecha">Elige la fecha</label>
            <input id="fecha" type="date" [min]="hoy" [(ngModel)]="fecha">

            <label>Elige la hora</label>
            <div class="horas">
                <button type="button"
                        class="hora"
                        *ngFor="let h of horarios"
                        [class.activa]="h === horarioSeleccionado"
                        (click)="seleccionarHorario(h)">
                    {{ h.hora }}
                </button>
            </div>

        </div>

        <!-- Columna derecha: pago -->
        <div class="columna-der">

            <h3 class="subtitulo">Datos de pago</h3>

            <label for="nombre">Nombre del titular</label>
            <input id="nombre" type="text" placeholder="Como aparece en la tarjeta"
                   (keypress)="permitir($event, 'letra')">

            <label for="tarjeta">Número de tarjeta</label>
            <input id="tarjeta" type="text" placeholder="1234 5678 9012 3456" maxlength="16"
                   (keypress)="permitir($event, 'numero')">

            <div class="dos-columnas">
                <div class="columna">
                    <label for="vence">Vencimiento</label>
                    <input id="vence" type="text" placeholder="MM/AA" maxlength="5"
                           (keypress)="permitir($event, 'fecha')">
                </div>

                <div class="columna">
                    <label for="cvv">CVV</label>
                    <input id="cvv" type="password" placeholder="123" maxlength="4"
                           (keypress)="permitir($event, 'numero')">
                </div>
            </div>

            <p class="total">Total a pagar: <strong>{{ servicio.precio }} COP</strong></p>

            <button class="btn-pagar" type="button"
                    [disabled]="!fecha || !horarioSeleccionado"
                    (click)="confirmar()">
                Pagar {{ servicio.precio }}
            </button>

        </div>

    </div>

</section>
