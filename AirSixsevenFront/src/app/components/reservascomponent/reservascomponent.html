<div class="contenedor-principal">
    <div class="formulario-card-horizontal">
        <h2>Reserva tu Alojamiento 67</h2>

        <div class="grid-layout">

            <div class="columna-inputs">
                <div class="campo">
                    <label for="nombre">Nombre completo: <span class="error-msg">{{nombreValidado}}</span></label>
                    <input
                            type="text"
                            id="nombre"
                            placeholder="Tu nombre real"
                            #inputNombre
                            (input)="verificarNombre(inputNombre.value)">
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico: <span class="error-msg">{{correoValidado}}</span></label>
                    <input
                            type="email"
                            id="correo"
                            placeholder="ejemplo@gmail.com"
                            #inputCorreo
                            (input)="verificarCorreo(inputCorreo.value)">
                </div>

                <div class="campo">
                    <label for="telefono">Número de teléfono: <span class="error-msg">{{telefonoCorrecto}}</span></label>
                    <input
                            type="tel"
                            id="telefono"
                            placeholder="+57 300 000 0000"
                            #inputTelefono
                            (input)="verificarTelefono(inputTelefono.value)">
                </div>

                <div class="campo">
                    <label for="cedula">Documento de identidad: <span class="error-msg">{{cedulaCorrecta}}</span></label>
                    <input
                            type="text"
                            id="cedula"
                            placeholder="Número de cédula"
                            #inputCedula
                            (input)="verificarCedula(inputCedula.value)">
                </div>

                <hr class="separador">

                <div class="campo">
                    <label for="llegada">Fecha de llegada:</label>
                    <input
                            type="date"
                            id="llegada"
                    >
                </div>

                <div class="campo">
                    <label for="salida">Fecha de salida:</label>
                    <input
                            type="date"
                            id="salida"
                            >
                </div>

                <div class="campo">
                    <label for="huespedes">Número de huéspedes:</label>
                    <input
                            type="number"
                            id="huespedes"
                            min="1"
                            >
                </div>
            </div>


            <div class="columna-cotizacion">
                <div class="cotizacion-card">
                    <h3 class="cotizacion-titulo">Detalles de la cotización</h3>

                    <div class="cotizacion-row">
                        <span class="label">Precio por noche</span>
                        <span class="value">$ COP</span>
                    </div>

                    <div class="cotizacion-row">
                        <span class="label">Número de noches</span>
                        <span class="value"></span>
                    </div>

                    <div class="cotizacion-row">
                        <span class="label">Subtotal</span>
                        <span class="value">$ COP</span>
                    </div>

                    <div class="cotizacion-row">
                        <span class="label">Tarifa de limpieza</span>
                        <span class="value">$ COP</span>
                    </div>

                    <div class="cotizacion-row">
                        <span class="label">Tarifa de servicio (10%)</span>
                        <span class="value">$ COP</span>
                    </div>

                    <div class="cotizacion-divider"></div>

                    <div class="cotizacion-total-row">
                        <span class="total-label">Total a pagar</span>
                        <span class="total-value">$COP</span>
                    </div>

                    <div class="cotizacion-alert" *ngIf=" 0">
                        Selecciona fechas válidas para calcular el total.
                    </div>
                </div>

                <div class="boton-container">
                    <button
                            class="btn-reservar"
                            [disabled]="!esCorreoValido || !esNombreValido || !esTelefonoValido || !esCedulaValida || 0">
                        Confirmar y pagar
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>
